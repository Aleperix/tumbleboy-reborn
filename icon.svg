<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- background -->
  <rect width="124" height="124" x="2" y="2" rx="16" fill="#363d52" stroke="#212532" stroke-width="4"/>
  <!-- ball shadow -->
  <ellipse cx="64" cy="96" rx="26" ry="6" fill="#1a1a2e" opacity="0.4"/>
  <!-- ball body -->
  <circle cx="64" cy="58" r="30" fill="#E53935"/>
  <!-- ball highlight -->
  <ellipse cx="54" cy="46" rx="10" ry="8" fill="#FF7043" opacity="0.7"/>
  <circle cx="50" cy="42" r="5" fill="#FFAB91" opacity="0.5"/>
  <!-- ball shadow (bottom) -->
  <ellipse cx="64" cy="82" rx="22" ry="4" fill="#C62828" opacity="0.5"/>
  <!-- motion lines -->
  <line x1="30" y1="52" x2="18" y2="56" stroke="#FF7043" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="32" y1="62" x2="16" y2="64" stroke="#FF7043" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="34" y1="72" x2="20" y2="76" stroke="#FF7043" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
</svg>
